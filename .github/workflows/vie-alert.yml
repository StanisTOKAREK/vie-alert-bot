name: vie-alert

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force email even without new offers"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          OFFERS_API_ENDPOINT: ${{ secrets.OFFERS_API_ENDPOINT }}
          SMTP_DEBUG: "false"
        run: |
          if [ "${{ github.event.inputs.force_send }}" = "true" ]; then
            python run_check.py --force-send || true
          else
            python run_check.py || true
          fi
